<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Fixture MPP Extension</title>
    <link rel="stylesheet" href="/extension/content.css">
    <style>
      body { margin: 0; padding: 40px; background: #111; color: white; font-family: system-ui, sans-serif; }
      .match-card { width: 520px; padding: 24px; border-radius: 18px; background: #272725; }
      .teams { display: flex; justify-content: space-between; font-size: 22px; font-weight: 800; }
      .scores, .quotations, .percentages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; text-align: center; }
      .scores { margin-top: 22px; }.scores input { width: 50px; margin: auto; padding: 8px; }
      .quotations { margin-top: 12px; color: #aaa; }.quote { padding: 5px; background: #171717; border-radius: 4px; }
      .percentages { margin-top: 4px; color: #666; font-size: 12px; }
    </style>
    <script>
      const fixtureLogs = [];
      globalThis.chrome = {
        runtime: {
          onMessage: { addListener() {} },
          async sendMessage(message) {
            if (message.type === "mpp-log") {
              fixtureLogs.push(message);
              document.querySelector("#logs").textContent = fixtureLogs.map(row => row.message).join("\n");
              return { ok: true };
            }
            if (message.type === "polymarket-recommendations") {
              return {
                ok: true,
                recommendations: message.matches.map(match => {
                  const probabilities = { home: .665, draw: .30, away: .125 };
                  const scoreData = {
                    home: { label: "2-0", probability: .14, crowdShare: .18, bonus: 50, rarityLabel: "très rare", exactEv: 7 },
                    draw: { label: "1-1", probability: .12, crowdShare: .31, bonus: 20, rarityLabel: "exact", exactEv: 2.4 },
                    away: { label: "0-1", probability: .07, crowdShare: .24, bonus: 30, rarityLabel: "rare", exactEv: 2.1 },
                  };
                  const options = [
                    { key: "home", label: match.home },
                    { key: "draw", label: "Nul" },
                    { key: "away", label: match.away },
                  ].map(option => {
                    const baseEv = probabilities[option.key] * match.quotations[option.key];
                    return {
                      ...option,
                      probability: probabilities[option.key],
                      points: match.quotations[option.key],
                      baseEv,
                      exactEv: scoreData[option.key].exactEv,
                      ev: baseEv + scoreData[option.key].exactEv,
                      bestScore: scoreData[option.key].label,
                      scoreProbability: scoreData[option.key].probability,
                      rarityLabel: scoreData[option.key].rarityLabel,
                      exactBonus: scoreData[option.key].bonus,
                    };
                  });
                  const best = Math.max(...options.map(option => option.ev));
                  const majorityKey = Object.keys(match.bets || {}).sort((left, right) => match.bets[right] - match.bets[left])[0];
                  options.forEach(option => {
                    option.isRecommended = best - option.ev < 1;
                    option.isContrarian = option.ev === best && majorityKey && option.key !== majorityKey;
                  });
                  return {
                    matchId: match.matchId, home: match.home, away: match.away,
                    confidence: 1, options,
                    scoreModel: { source: "Poisson calibré sur Polymarket" },
                    scoreRecommendations: Object.fromEntries(Object.entries(scoreData).map(([key, score]) => [
                      key,
                      Array.from({ length: key === "draw" ? 9 : 10 }, (_, index) => ({
                        ...score,
                        label: index === 0 ? score.label : key === "draw" ? `${index + 1}-${index + 1}` : key === "home" ? `${index + 2}-${index}` : `${index}-${index + 2}`,
                        probability: score.probability * (1 - index * .25),
                        outcome: key,
                        outcomeProbability: probabilities[key],
                        points: match.quotations[key],
                        baseEv: probabilities[key] * match.quotations[key],
                        ev: probabilities[key] * match.quotations[key] + score.exactEv * (1 - index * .2),
                      })),
                    ])),
                  };
                }),
                missing: [],
              };
            }
          },
        },
      };
    </script>
    <script src="/extension/page-hook.js"></script>
    <script defer src="/extension/content.js"></script>
  </head>
  <body>
    <article class="match-card">
      <div class="teams"><span>France</span><span>Sénégal</span></div>
      <div class="scores"><input><span>Nul</span><input></div>
      <div class="quotations"><span class="quote">46</span><span class="quote">128</span><span class="quote">153</span></div>
      <div class="percentages"><span>66%</span><span>21%</span><span>13%</span></div>
    </article>
    <h2>Journal simulé</h2><pre id="logs"></pre>
    <script>
      addEventListener("DOMContentLoaded", async () => {
        for (const path of ["/web/api.mpp.football/clubs.json", "/web/api.mpp.football/matches.json"]) {
          const data = await fetch(path).then(response => response.json());
          dispatchEvent(new CustomEvent("mpp-esperance-api", { detail: { url: path, data } }));
        }
      });
    </script>
  </body>
</html>
